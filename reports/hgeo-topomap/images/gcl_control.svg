<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Geometry grouping is necessary for the GCL gain</title>
  <desc id="desc">Baseline scores 0.1054, geometry-grouped GCL scores 0.1247, and an arbitrary index-group control scores 0.1069.</desc>
  <rect width="900" height="360" fill="#fbfcfe"/>
  <text x="40" y="42" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#172033">Arbitrary groups erase the GCL gain</text>
  <text x="40" y="69" font-family="system-ui,sans-serif" font-size="15" fill="#526078">Compact DET_l, 8-seed means</text>
  <g font-family="system-ui,sans-serif" font-size="17" fill="#24324a">
    <text x="40" y="133">Baseline</text><text x="40" y="213">Geometry groups</text><text x="40" y="293">Index groups</text>
  </g>
  <g stroke="#d9dfeb"><line x1="300" y1="90" x2="300" y2="315"/><line x1="700" y1="90" x2="700" y2="315"/></g>
  <rect x="300" y="106" width="422" height="35" rx="6" fill="#aab5c7"/>
  <rect x="300" y="186" width="499" height="35" rx="6" fill="#8b6fc3"/>
  <rect x="300" y="266" width="428" height="35" rx="6" fill="#d19b53"/>
  <g font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#172033">
    <text x="732" y="131">0.1054</text><text x="809" y="211">0.1247</text><text x="738" y="291">0.1069</text>
  </g>
</svg>
